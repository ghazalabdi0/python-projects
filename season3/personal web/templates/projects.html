{% extends "base.html" %}

{% block content %}

<h2>Projects</h2>

{% for project in projects %}

<div class="card">

    <h3>{{ project.title }}</h3>

    <p>{{ project.description }}</p>

    <a href="{{ project.github }}" target="_blank">
        GitHub
    </a>

</div>

{% endfor %}

{% endblock %}
