<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Interest Form</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2 class="mb-4">Interest Registration Form</h2>

<form action="/add" method="POST">

<div class="mb-3">

<label class="form-label">Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Age</label>

<input
type="number"
name="age"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Interest</label>

<input
type="text"
name="interest"
class="form-control"
placeholder="Programming, Sports, Painting...">

</div>

<div class="mb-3">

<label class="form-label">Interest Level</label>

<select
name="level"
class="form-select">

<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">Additional Description</label>

<textarea
name="description"
class="form-control"
rows="3"></textarea>

</div>

<button
class="btn btn-primary">
Submit
</button>

</form>

<hr>

<h3>Registered Records</h3>

<table class="table table-bordered table-striped">

<thead>

<tr>

<th>Name</th>
<th>Age</th>
<th>Interest</th>
<th>Level</th>
<th>Description</th>

</tr>

</thead>

<tbody>

{% for record in records %}

<tr>

<td>{{ record.name }}</td>
<td>{{ record.age }}</td>
<td>{{ record.interest }}</td>
<td>{{ record.level }}</td>
<td>{{ record.description }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
